service:
  name: service-kafka
  namespace: aicares
image:
  repository: 952893849914.dkr.ecr.us-east-1.amazonaws.com/aicares-application/kafka
  tag: latest
  pullPolicy: Always
containerPort: 9092
resources:
  limits:
    memory: "1Gi"
  requests:
    memory: "512Mi"
    cpu: "200m"
env:
  - name: KAFKA_CONTROLLER_QUORUM_VOTERS
    value: "1@localhost:9093"
  - name: KAFKA_LISTENERS
    value: "PLAINTEXT://:9092,CONTROLLER://:9093"
  - name: KAFKA_ADVERTISED_LISTENERS
    value: "PLAINTEXT://kafka:9092"
  - name: OTEL_SERVICE_NAME
    value: "kafka"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector:4317"
  - name: OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE
    value: "cumulative"
nodeSelector:
  eks.amazonaws.com/nodegroup: graviton-workers
